; Anchors are resolved per monitor, so this config survives a resolution
; change or a swap between machines. `monitor=-1` follows the primary display.

[clock_primary]
type=clock
preset=midnight
monitor=-1
anchor=top_right
x=-56
y=56
width=340
height=150
font_size=64

[clock_secondary]
type=clock
preset=nord
monitor=1
anchor=bottom_right
x=-56
y=-56
width=300
height=130
font_size=54
show_seconds=true
time_format=HH:mm:ss
show_date=false
