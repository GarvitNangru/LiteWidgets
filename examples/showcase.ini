; A tour of the styling engine. Drop this in and open Settings to poke at it.

[gradient]
type=clock
anchor=top_center
y=48
width=440
height=176
bg_color=F00E0B1A
bg_color2=F01D1436
bg_gradient=diagonal
corner_radius=24
border_color=44A78BFA
border_width=1
text_color=FF7DD3FC
text_color2=FFF0ABFC
text_gradient=horizontal
font_size=72
letter_spacing=2
time_format=h:mm
date_format='GRADIENT TEXT'
date_letter_spacing=6
date_font_size=13
date_color=AAF0ABFC

[glow]
type=clock
preset=terminal
anchor=left
x=48
width=340
height=140
font_size=54
show_seconds=true
blink_separator=true
time_format=HH:mm:ss
date_format='SYSTEM CLOCK'
date_letter_spacing=4

[outlined]
type=clock
anchor=right
x=-48
width=380
height=150
bg_color=00000000
corner_radius=0
text_color=FFFFFFFF
outline_color=FF17172B
outline_width=3
shadow_color=99000000
shadow_offset_y=4
font_size=66
font_style=bold
date_format='OUTLINE + SHADOW'
date_font_size=14
date_letter_spacing=4

[stacked]
type=clock
preset=sunset
anchor=bottom_center
y=-48
width=400
height=180
font_size=64
time_ratio=0.55
time_format=h:mm tt
date_format=dddd
date_transform=upper
date_font_size=18
date_letter_spacing=8
date_gap=8
