; Two dials. The neon one sweeps its second hand, which costs a 50ms timer --
; the plain one ticks once a second and is close to free.

[dial]
type=clock
mode=analog
preset=carbon
anchor=top_right
x=-48
y=48
width=190
height=190
show_seconds=true
tick_count=12
tick_length=9
minute_ticks=true

[dial_neon]
type=clock
mode=analog
preset=neon
anchor=top_right
x=-48
y=268
width=190
height=190
show_seconds=true
smooth_seconds=true
face_color=CC05050A
face_color2=CC12203A
face_gradient=diagonal
tick_count=4
tick_length=14
tick_width=3
ring_width=3
minute_ticks=true
hand_scale=1.05
