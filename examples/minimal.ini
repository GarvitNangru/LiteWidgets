; Text straight on the wallpaper: no panel, just a drop shadow so it stays
; readable over a busy background.

[clock]
type=clock
preset=minimal
anchor=bottom_left
x=48
y=-48
width=420
height=150
font_size=76
font_style=bold
align_h=left
letter_spacing=-2
show_date=true
date_format=dddd, d MMMM
date_font_size=16
date_transform=upper
date_letter_spacing=4
date_gap=6
