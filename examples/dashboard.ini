; A desktop status panel: three system gauges down the left edge and a month
; view under them. Nothing here polls -- each gauge wakes on its own schedule
; and only repaints when the number it draws would actually change.

[cpu]
type=gauge
source=cpu
gauge_style=bar
preset=midnight
anchor=top_left
x=40
y=48
width=280
height=76
font_size=15
thickness=8
warn_above=85

[memory]
type=gauge
source=memory
gauge_style=bar
show_detail=true
preset=midnight
anchor=top_left
x=40
y=136
width=280
height=96
font_size=15
thickness=8
warn_above=90

[disk]
type=gauge
source=disk
drive=C:
gauge_style=ring
preset=midnight
anchor=top_left
x=40
y=244
width=180
height=180
font_size=30
thickness=14
warn_above=90

[battery]
type=gauge
source=battery
gauge_style=number
show_detail=true
preset=midnight
anchor=top_left
x=232
y=244
width=180
height=180
font_size=44
warn_below=20

[month]
type=calendar
preset=midnight
anchor=top_left
x=40
y=444
width=320
height=300
font_size=17
week_start=monday
