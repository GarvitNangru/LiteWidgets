; A desktop status panel: one gauge holding four readings, a row of rings, and
; a month view. Nothing here polls -- each reading wakes on its own schedule
; and the widget only repaints when a number it draws would actually change.

[machine]
type=gauge
source=cpu, memory, disk, battery
warn_above=85, 90, 90, 0
warn_below=0, 0, 0, 20
show_detail=true
preset=midnight
anchor=top_left
x=40
y=48
width=300
height=340
font_size=15
thickness=8

[drives]
type=gauge
source=disk, disk
drive=C:, D:
label=SYSTEM, DATA
gauge_style=ring
gauge_layout=horizontal
preset=midnight
anchor=top_left
x=40
y=408
width=300
height=150
font_size=24
thickness=10
warn_above=90

[month]
type=calendar
preset=midnight
anchor=top_left
x=40
y=578
width=300
height=290
font_size=17
week_start=monday
