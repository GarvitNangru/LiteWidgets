; ============================================================
;  LiteWidgets — widget configuration
;
;  Every [section] is one widget. The section name is just a
;  label; rename it to whatever you like.
;
;  Full key reference: docs/CONFIGURATION.md
;  Tip: the Settings editor (tray icon) edits this file for you
;  and shows a live preview while you type.
; ============================================================

[clock]
type=clock
preset=midnight
anchor=top_right
x=-60
y=64
width=360
height=156
font_size=66
font_style=regular
letter_spacing=-1
format=12h
show_seconds=false
show_date=true
date_format=dddd, d MMMM
date_transform=upper
date_letter_spacing=3
date_font_size=13
