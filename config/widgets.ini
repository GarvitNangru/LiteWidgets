; ============================================================
; LiteWidgets Configuration
; ============================================================
; Each [section_name] defines one widget instance.
;
; Common properties:
;   type          = clock | notes | image
;   x, y          = position on screen (pixels)
;   width, height = size (pixels)
;   click_through = true | false
;
; Styling (all optional, sensible defaults apply):
;   bg_color      = AARRGGBB hex (e.g. D9181825)
;   text_color    = AARRGGBB hex (e.g. FFFFFFFF)
;   border_color  = AARRGGBB hex
;   border_width  = pixels (0 = no border)
;   corner_radius = pixels (0 = sharp corners)
;   font_family   = font name (e.g. Segoe UI)
;   font_size     = pixels
;   font_style    = regular | bold | italic | bold_italic
;   align_h       = left | center | right
;   align_v       = top | center | bottom
;   padding       = pixels
;
; Clock-specific:
;   format        = 12h | 24h
;   show_seconds  = true | false
;   show_date     = true | false
;   date_font_size  = pixels (default: 40% of font_size)
;   date_font_style = regular | bold | italic
;   date_color      = AARRGGBB hex (default: 60% opacity text)
;
; Notes-specific:
;   path          = path to text file (relative to this INI)
; ============================================================

[clock_1]
type=clock
x=100
y=50
width=280
height=120
format=12h
show_seconds=false
show_date=true
click_through=true

; Styling
font_family=Segoe UI
font_size=42
font_style=bold
text_color=FFFFFFFF
date_font_size=14
date_font_style=regular
date_color=99FFFFFF
bg_color=D9181825
corner_radius=16
border_color=33FFFFFF
border_width=1
padding=12
align_h=center

[notes_1]
type=notes
x=100
y=200
width=280
height=200
path=notes.txt
click_through=true

; Styling
font_family=Segoe UI
font_size=13
font_style=regular
text_color=DDCDD6F4
bg_color=D91E1E2E
corner_radius=12
border_color=22FFFFFF
border_width=1
padding=14
align_h=left
align_v=top
