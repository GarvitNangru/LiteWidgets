name: Bug report
description: Something renders wrong, crashes, or does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Widget config
      description: The `[section]` from `config/widgets.ini` that reproduces it.
      render: ini
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or the commit you built from.
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 (10.0.26100)"

  - type: input
    id: display
    attributes:
      label: Display setup
      description: Number of monitors, resolutions, and display scaling.
      placeholder: "2 monitors, 3840x2160 @ 150% and 1920x1080 @ 100%"

  - type: textarea
    id: wallpaper
    attributes:
      label: Wallpaper software
      description: Wallpaper Engine, Lively, Rainmeter, or anything else that draws on the desktop.
